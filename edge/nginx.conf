# Historical Phase 1 reference; not the installed Phase 2 runtime configuration.
# Live edges use .runtime/nginx.conf generated by phase2/render.sh.
pid /tmp/cn-project-nginx.pid;

events {}

http {
    upstream cn_backends {
        server 127.0.0.1:3001 max_fails=1 fail_timeout=5s;
        server 10.7.26.228:3002 max_fails=1 fail_timeout=5s;
    }

    # HTTP — keep for testing
    server {
        listen 8080;
        server_name app.cn-project.test api.cn-project.test;

        location / {
            proxy_pass http://cn_backends;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header Connection "";
        }
    }

    # HTTPS / TLS
    server {
        listen 8443 ssl;
        server_name app.cn-project.test api.cn-project.test;

        ssl_certificate     /opt/homebrew/etc/nginx/certs/server.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://cn_backends;
            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Connection "";
        }
    }
}
